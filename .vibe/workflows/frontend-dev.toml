All steps completed successfully!

Summary:
  Total Duration: <duration>
  Commit Hash: <hash>
  Branch: <branch>
  
Achievements:
  ✅ UI requirements defined
  ✅ UI design completed
  ✅ TDD RED phase passed
  ✅ TDD GREEN phase passed
  ✅ TDD REFACTOR phase passed
  ✅ Code review passed
  ✅ API integration tests passed
  ✅ Pre-commit validation passed
  ✅ Pre-push validation passed
  ✅ Code committed and pushed

Quality Metrics:
  Code Coverage: <percentage>%
  Lint Errors: <count>
  Security Issues: <count>
  Build Status: <status>
  Test Status: <status>
  Bundle Size: <size>

Next Steps:
  1. Monitor deployment
  2. Test in staging environment
  3. Gather user feedback
  4. Plan next UI feature
---

===== TIMEOUTS =====

Step Timeouts:
- REQUIREMENTS: 60 minutes (user-driven)
- DESIGN: 60 minutes (user-driven)
- TDD RED: 60 seconds (agent-driven)
- TDD GREEN: 180 seconds (agent-driven)
- TDD REFACTOR: 300 seconds (agent-driven)
- CODE REVIEW: 300 seconds (agent-driven)
- API INTEGRATION: 300 seconds (agent-driven)
- FINAL VALIDATION: 300 seconds (agent-driven)

Total Workflow Timeout: 1800 seconds (30 minutes)

===== FRONTEND-SPECIFIC CONSIDERATIONS =====

Accessibility:
- WCAG 2.1 AA compliance
- Keyboard navigation
- Screen reader support
- Color contrast ratios (4.5:1 for text)
- ARIA labels and roles
- Semantic HTML

Performance:
- Bundle size < 5MB (uncompressed)
- First Contentful Paint < 2s
- Time to Interactive < 5s
- Lighthouse score > 90
- Code splitting for large components
- Lazy loading for non-critical components

Best Practices:
- React hooks usage
- Component composition
- State management (Context, Redux, Zustand)
- TypeScript strict mode
- Error boundaries
- Loading states
- Responsive design (mobile-first)
- Consistent styling

===== USER INTERACTION =====

At each step, this agent will:
1. Explain what needs to be done for frontend development
2. Show what has been completed so far
3. Delegate to subagents when appropriate
4. Collect and display results
5. Ask for user input when needed
6. Guide the user through the frontend development process

User can:
- Ask questions about the workflow
- Request to skip steps (with justification)
- Request to retry steps
- Request to see detailed results
- Request to test specific UI scenarios
- Request to stop and resume later
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "git",
  "npm",
  "npx",
  "node",
  "go",
  "atlas",
  "docker",
  "curl"
]
timeouts = { 
  default = 180, 
  user_interaction = 3600, 
  agent_delegation = 300, 
  full_workflow = 1800 
}
