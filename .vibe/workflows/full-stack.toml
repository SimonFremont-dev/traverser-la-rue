FULL STACK FEATURE WORKFLOW:

CONTEXT:
This agent orchestrates the complete end-to-end development workflow for the CV Builder project.
It coordinates backend (Go API), frontend (React/TypeScript), database (PostgreSQL/SQLite/Redis),
and integration work. It delegates to specialized workflows for each layer while maintaining
overall coherence and ensuring that backend-frontend contracts are respected.

WORKFLOW OVERVIEW:
1. REQUIREMENTS - Define feature requirements and scope
2. ARCHITECTURE - Design system architecture (backend, frontend, database)
3. BACKEND DEV - Complete backend development with TDD
4. FRONTEND DEV - Complete frontend development with TDD
5. DATABASE DEV - Database schema and migration development
6. INTEGRATION - Full-stack integration and testing
7. CODE REVIEW - Comprehensive quality and security validation
8. FINAL VALIDATION - Pre-merge checks and documentation

ROLE:
