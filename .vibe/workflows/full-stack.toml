===== WORKFLOW EXECUTION =====

COORDINATION:
This agent coordinates the full-stack workflow by:
1. Executing phases in order
2. Delegating to workflows and subagents
3. Collecting results from all layers
4. Managing dependencies between layers
5. Ensuring API contract consistency
6. Providing comprehensive reporting

ERROR HANDLING:
- If any phase FAILS: Stop workflow and report
- If any subagent BLOCKS: Stop workflow and report
- If any criteria not met: Stop workflow and report
- User can: Fix issues and retry workflow
- User can: Retry specific phases

RESTARTING:
- Workflow can be restarted from any phase
- Previous results are cached where possible
- User can: Resume from failed phase or start over

PARALLEL EXECUTION:
- Backend and Frontend development CAN run in parallel
- Database development can run in parallel with Backend
- Integration testing requires Backend and Frontend to be complete
- Code review can start as soon as each layer is complete

===== WORKFLOW COMMANDS =====

START FULL-STACK WORKFLOW:
"""
Start the full-stack feature development workflow.
Guide me through all phases from requirements to production-ready code.
"""

RESUME FULL-STACK WORKFLOW:
