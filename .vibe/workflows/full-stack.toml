===== FULL-STACK SPECIFIC CONSIDERATIONS =====

API Contract Consistency:
- Backend and frontend must agree on API contract
- TypeScript types must match Go structs
- HTTP methods and status codes must be consistent
- Request/response formats must be consistent
- Error handling must be consistent

Data Flow:
- Personal data (SQLite) should never be exposed to regular data (PostgreSQL)
- Redis cache should respect data privacy
- API should not expose sensitive personal data
- Frontend should handle data appropriately

Integration Patterns:
- Backend provides REST API
- Frontend consumes REST API
- Backend connects to PostgreSQL and SQLite
- Backend uses Redis for caching
- Frontend uses React Query or similar for data fetching

Error Handling:
- Backend: HTTP status codes and error messages
- Frontend: User-friendly error messages
- Database: Proper error handling for all operations
- Integration: Graceful degradation when API is unavailable

Testing Strategy:
- Backend: Unit tests, integration tests
- Frontend: Unit tests, component tests, integration tests
- Database: Migration tests, query tests
- Integration: End-to-end tests, API contract tests

===== CV BUILDER SPECIFIC FEATURES =====

Feature Implementation Notes:

1. Resume Building (Right Panel):
   - Component: ResumeBuilder
   - Manages: Experiences, educations, projects, skills
   - Links: Skills to experiences/educations/projects
   - UI: Right panel layout

2. Job Offer Scanning:
   - Backend: Job offer parsing and skill extraction
   - Frontend: Job offer input and scanning trigger
   - Output: List of required skills

3. Experience Filtering:
   - Backend: Filter experiences based on required skills
   - Logic: Remove experiences without any required skills
   - Optimization: Keep as many experiences as fit on one page
   - Output: Filtered list of experiences

4. Resume Optimization:
   - Backend: Calculate which experiences fit on one page
   - Logic: Prioritize experiences with most relevant skills
   - Layout: Ensure one-page resume

5. Data Storage:
   - PostgreSQL: Regular data (job offers, etc.)
   - SQLite: Personal data (resume, experiences, education, projects, skills)
   - Redis: Cache (parsed job offers, filtered results, etc.)

===== USER INTERACTION =====

At each phase, this agent will:
1. Explain what needs to be done
2. Show what has been completed so far
3. Delegate to workflows and subagents when appropriate
4. Collect and display results from all layers
5. Ask for user input when needed
6. Guide the user through the complete feature development process

User can:
- Ask questions about any phase
- Request to skip phases (with justification)
- Request to retry phases
- Request to see detailed results from any layer
- Request to focus on specific layers
- Request to test specific scenarios
- Request to stop and resume later
- Request to run phases in different order
- Request to run phases in parallel
"""

