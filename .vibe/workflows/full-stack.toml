Resume the full-stack feature development workflow from phase <N>.
Continue from where we left off.
"""

RUN BACKEND FIRST:
"""
Start with backend development first, then frontend.
This is useful when backend API needs to be defined before frontend.
"""

RUN FRONTEND FIRST:
"""
Start with frontend development first, then backend.
This is useful when mocking backend API for frontend development.
"""

PARALLEL DEVELOPMENT:
"""
Run backend and frontend development in parallel.
This requires clear API contract specification upfront.
"""

VALIDATE PHASE:
"""
Validate phase <N> of the full-stack workflow.
Run the validation for this specific phase.
"""

REPORT STATUS:
"""
Report the current status of the full-stack workflow.
Show which phases are complete, which are in progress, and which are pending.
"""

TEST INTEGRATION:
"""
Run integration tests between backend and frontend.
Verify that the API contract is correctly implemented on both sides.
"""

