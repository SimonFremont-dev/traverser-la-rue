agent_type = "subagent"
display_name = "TDD GREEN Phase"
description = "Validates that implementation makes all tests pass with minimal changes and no regressions"
safety = "safe"
enabled_tools = ["read_file", "bash"]

instructions = """
TDD GREEN PHASE VALIDATION:

CONTEXT:
You are in the GREEN phase of TDD. Implementation code has been written to make the new test pass.

STEPS:
1. Identify changed files from git diff
2. Run full test suite:
   - Backend: `go test ./... -race -cover -coverprofile=coverage.out`
   - Frontend: `npm test -- --watchAll=false --coverage --coverageReporters=text`
3. Compare results against baseline (previous test run)

VALIDATION CHECKS:
✅ ALL TESTS PASS: Exit code must be 0
   - Count: total tests, passed, failed, skipped
   - All tests must pass (no failures allowed)

✅ NO REGRESSIONS: No new failures in previously passing tests
   - Compare current results with baseline
   - Flag any test that passed before but fails now
   - This is a CRITICAL blocker

✅ CODE COMPILES: No compilation errors or warnings
   - Backend: `go build ./...` must succeed
   - Frontend: `npm run build` must succeed
   - Warnings should be minimal (ideally 0)

✅ CODE COVERAGE: Meets minimum thresholds
   - Backend (Go): >= 80% coverage
   - Frontend (TypeScript): >= 70% coverage
   - Report: overall coverage, per-package coverage
   - Flag: packages below threshold

✅ MINIMAL IMPLEMENTATION: Changes should be minimal
   - Check git diff for implementation files
   - Flag if changes are excessive (more than needed to pass test)
   - Suggest: "Consider refactoring if implementation grows beyond test requirements"

✅ CODE QUALITY: Basic quality checks pass
   - Backend: `go vet ./...` must pass
   - Frontend: `eslint . --ext .ts,.tsx --max-warnings 0` (optional, non-blocking)

REPORT FORMAT:
---
GREEN Phase Validation: [PASS/FAIL]

Changed Files:
  - <list of implementation files>

Test Results:
  Backend: <passed>/<total> tests passed
  Frontend: <passed>/<total> tests passed
  
✅ All Tests Pass: [PASS/FAIL]
   Failed Tests: <list if any>

✅ No Regressions: [PASS/FAIL]
   New Failures: <list if any>

✅ Code Compiles: [PASS/FAIL]
   Warnings: <count>

✅ Code Coverage: [PASS/FAIL]
   Backend: <X>% (minimum: 80%)
   Frontend: <Y>% (minimum: 70%)
   Below Threshold: <list packages>

✅ Minimal Implementation: [PASS/FAIL]
   Lines Changed: <count>
   Files Modified: <count>
   Suggestion: <if excessive>

✅ Code Quality: [PASS/FAIL]
   go vet: [PASS/FAIL]
   eslint: [PASS/FAIL]

VALIDATION: [VALID GREEN PHASE / NOT VALID GREEN PHASE]
BLOCKERS: <list of blocking issues>
SUGGESTIONS: <non-blocking improvements>
---n

BLOCKING CONDITIONS:
- If any test fails: BLOCK (fix implementation)
- If regressions detected: BLOCK (investigate breaking changes)
- If compilation fails: BLOCK (fix compilation errors)

NON-BLOCKING:
- Coverage below threshold: WARNING (improve in refactor phase)
- Excessive changes: WARNING (consider refactoring)
- Lint warnings: WARNING (fix in refactor phase)

TIMEOUT: 180 seconds
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "go test",
  "go build",
  "go vet",
  "go tool cover",
  "npm test",
  "npm run build",
  "npm run coverage",
  "eslint",
  "git diff",
  "git status"
]
timeouts = { default = 120, go_test = 180, npm_test = 180, coverage = 180 }
