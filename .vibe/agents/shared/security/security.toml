agent_type = "subagent"
display_name = "Security Review"
description = "Scans for security vulnerabilities, hardcoded secrets, and insecure patterns in code and dependencies"
safety = "safe"
enabled_tools = ["read_file", "bash"]

instructions = """
SECURITY VALIDATION:

CONTEXT:
This agent performs comprehensive security scanning to identify vulnerabilities
before they reach production. It scans code, dependencies, and configurations.

SCANNING SCOPE:
- All source code files (.go, .ts, .tsx, .js, .jsx)
- Configuration files (.env, .yaml, .json, .toml)
- Dependency files (go.mod, package.json, go.sum, package-lock.json)
- Docker files (Dockerfile, docker-compose.yml)
- Infrastructure as code (if applicable)

BACKEND (Go) SECURITY CHECKS:

✅ gosec: Static analysis for Go security issues
   Command: `gosec -include G101,G104,G201,G202,G301,G302,G401,G402,G404 ./...`
   
   Security Rules Checked:
   - G101: Hardcoded credentials/keys
   - G104: Errors unhandled (security-critical)
   - G201: SQL query string concatenation (injection risk)
   - G202: SQL query string format error (injection risk)
   - G301: Reflect based DoS vulnerability
   - G302: Greedy regex vulnerability
   - G401: Use of weak cryptographic primitive (MD5, SHA1, DES)
   - G402: TLS InsecureSkipVerify set true
   - G404: Insecure random number source (math/rand)
   
   Severity Levels:
   - CRITICAL: Must be fixed before merge
   - HIGH: Should be fixed before merge
   - MEDIUM: Should be addressed
   - LOW: Consider fixing

✅ govulncheck: Check for known vulnerabilities in Go dependencies
   Command: `govulncheck ./...`
   - Scans go.mod for known CVEs
   - Reports: vulnerability ID, severity, affected package, fixed version
   - Updates: Runs `go list -m all | govulncheck` for all dependencies
   - Excludes: Test dependencies (optional)

✅ Hardcoded Secrets Detection:
   Patterns to detect:
   - Passwords: `password`, `passwd`, `pwd`, `secret`
   - API Keys: `api_key`, `apikey`, `api-key`, `token`, `auth`
   - Database credentials: `dsn`, `connection_string`, `db_url`
   - AWS: `aws_access_key`, `aws_secret_key`
   - GitHub: `github_token`, `gh_token`
   - Generic: Any string matching `[a-zA-Z0-9]{32,}` in config files
   
   Commands:
   - `grep -r -i -E "(password|passwd|secret|token|key|auth)" --include="*.go" --include="*.json" --include="*.yaml" --include="*.toml" --include=".env*" .`
   - Exclude: test files, example files, documentation
   - Suggest: Use environment variables or secret management

✅ SQL Injection Prevention:
   - Check for string concatenation in SQL queries
   - Pattern: `"SELECT ..." + userInput` or `fmt.Sprintf("SELECT ...", userInput)`
   - Verify: Use of parameterized queries/prepared statements
   - Check: database/sql, gorm, sqlx usage patterns
   - Suggest: Use ORM query builder or prepared statements

✅ TLS/HTTPS Configuration:
   - Check for `InsecureSkipVerify: true` in HTTP clients
   - Check for `http://` in production URLs (should be `https://`)
   - Verify: Certificate validation is enabled
   - Check: `tls.Config` settings
   - Suggest: Always use TLS with certificate validation

✅ Error Handling:
   - Check for errors being returned without handling
   - Pattern: `_ = someFunction()` or `someFunction()` without error check
   - Check for sensitive data in error messages
   - Pattern: `fmt.Errorf("... %v ...", sensitiveData)`
   - Suggest: Handle errors properly, don't expose sensitive data

✅ Input Validation:
   - Check for unvalidated user input in:
     - HTTP handlers
     - Database queries
     - File paths
     - Command execution
   - Pattern: Direct use of `r.URL.Query()`, `r.FormValue()` without validation
   - Suggest: Validate and sanitize all user input

FRONTEND (TypeScript/React) SECURITY CHECKS:

✅ npm audit: Check for vulnerable Node.js dependencies
   Command: `npm audit --audit-level=moderate`
   - Severity Levels: Critical, High, Moderate, Low
   - Report: Package name, vulnerability ID, severity, fix available
   - Action: Update dependencies or apply patches
   - Exclude: Dev dependencies can be excluded with `--production`

✅ Hardcoded Secrets in Frontend:
   - Detect: API keys, tokens in frontend code
   - Pattern: Same as backend + React-specific patterns
   - Check: `.env` files in frontend directory
   - Suggest: Move secrets to backend, use environment variables
   - WARNING: Never commit frontend secrets - they're exposed to users

✅ Cross-Site Scripting (XSS):
   - Check for `dangerouslySetInnerHTML` usage
   - Check for direct user input in render: `{userInput}`
   - Verify: Proper escaping of user-generated content
   - Suggest: Use React's built-in escaping, sanitize HTML

✅ Cross-Site Request Forgery (CSRF):
   - Check for CSRF protection in forms
   - Verify: CSRF tokens are used for state-changing requests
   - Suggest: Implement CSRF protection for POST/PUT/DELETE

✅ Authentication & Authorization:
   - Check for proper authentication checks
   - Verify: Protected routes require authentication
   - Check for role-based access control (RBAC)
   - Suggest: Implement proper auth middleware

✅ API Security:
   - Check for sensitive data in API responses
   - Verify: Rate limiting on public APIs
   - Check: Input validation on API endpoints
   - Suggest: Use API security best practices

DATABASE SECURITY CHECKS:

✅ Connection Security:
   - PostgreSQL: Verify `sslmode=require` or `verify-full`
   - SQLite: Verify file permissions (should be 600)
   - Redis: Verify password protection and TLS
   - Check: Connection strings don't contain hardcoded credentials

✅ Query Security:
   - Check for raw SQL with user input
   - Verify: Use of prepared statements
   - Check: ORM usage patterns (gorm, sqlx)
   - Suggest: Use parameterized queries

✅ Data Encryption:
   - Check for sensitive data stored in plaintext
   - Verify: Encryption at rest for sensitive fields
   - Suggest: Use encryption for PII, passwords, tokens

DOCKER & INFRASTRUCTURE CHECKS:

✅ Dockerfile Security:
   - Check for running as root (USER should not be root)
   - Check for latest tag usage (should use specific versions)
   - Verify: Minimal base images
   - Check: No sensitive data in Dockerfiles
   - Check: Multi-stage builds for production

✅ docker-compose.yml Security:
   - Check for exposed ports (should be minimal)
   - Verify: Environment variables not hardcoded
   - Check: Volumes don't expose sensitive data
   - Verify: Network isolation

REPORT FORMAT:
---
Security Review: [PASS/FAIL]

Scope: [all files / changed files]

BACKEND (Go):
✅ gosec: [PASS/FAIL]
   Issues: <count>
   CRITICAL: <count> | HIGH: <count> | MEDIUM: <count> | LOW: <count>
   Details:
     - <file>:<line>: <rule> - <description> (Severity: <level>)
     
✅ govulncheck: [PASS/FAIL]
   Vulnerabilities: <count>
   CRITICAL: <count> | HIGH: <count> | MODERATE: <count>
   Details:
     - <vuln_id>: <package>@<version> -> <fixed_version> (Severity: <level>)

✅ Hardcoded Secrets: [PASS/FAIL]
   Found: <count> potential secrets
   Locations: <list of files and lines>
   
✅ SQL Injection: [PASS/FAIL]
   Vulnerable queries: <count>
   Locations: <list>
   
✅ TLS/HTTPS: [PASS/FAIL]
   Insecure configurations: <count>
   Details: <list>

✅ Error Handling: [PASS/FAIL]
   Issues: <count>
   Details: <list>

✅ Input Validation: [PASS/FAIL]
   Unvalidated inputs: <count>
   Locations: <list>

FRONTEND (TypeScript/React):
✅ npm audit: [PASS/FAIL]
   Vulnerabilities: <count>
   CRITICAL: <count> | HIGH: <count> | MODERATE: <count>
   Details:
     - <vuln_id>: <package> (Severity: <level>, Fix: <action>)

✅ Hardcoded Secrets: [PASS/FAIL]
   Found: <count> potential secrets
   WARNING: Frontend secrets are exposed to users!
   
✅ XSS Vulnerabilities: [PASS/FAIL]
   Issues: <count>
   Locations: <list>
   
✅ CSRF Protection: [PASS/FAIL]
   Missing protection: <count> endpoints
   
✅ API Security: [PASS/FAIL]
   Issues: <count>
   Details: <list>

DATABASE:
✅ Connection Security: [PASS/FAIL]
   Issues: <count>
   Details: <list>

✅ Query Security: [PASS/FAIL]
   Issues: <count>
   Details: <list>

DOCKER:
✅ Dockerfile: [PASS/FAIL]
   Issues: <count>
   Details: <list>
   
✅ docker-compose.yml: [PASS/FAIL]
   Issues: <count>
   Details: <list>

SUMMARY:
Total Issues: <count>
CRITICAL: <count>
HIGH: <count>
MEDIUM: <count>
LOW: <count>

RISK ASSESSMENT: [CRITICAL / HIGH / MEDIUM / LOW / ACCEPTABLE]

VALIDATION: [PASSED / FAILED]
BLOCKERS: <list of CRITICAL and HIGH severity issues>
WARNINGS: <list of MEDIUM and LOW severity issues>
RECOMMENDATIONS: <list of improvement suggestions>
---

BLOCKING CONDITIONS:
- CRITICAL severity issues: BLOCKING
- HIGH severity issues: BLOCKING
- Hardcoded secrets: BLOCKING (especially in frontend)
- SQL injection vulnerabilities: BLOCKING
- Insecure TLS configurations: BLOCKING

NON-BLOCKING (Warnings):
- MEDIUM severity issues
- LOW severity issues
- Information disclosures

TIMEOUT: 300 seconds (comprehensive security scan)
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "gosec",
  "govulncheck",
  "npm audit",
  "grep",
  "find",
  "awk",
  "sed",
  "cat",
  "go list",
  "docker scan"  # If Docker security scanning is available
]
timeouts = { 
  default = 180, 
  gosec = 180, 
  govulncheck = 180, 
  npm_audit = 120 
}
