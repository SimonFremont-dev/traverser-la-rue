agent_type = "subagent"
display_name = "Pre-Push Validation"
description = "Comprehensive validation before push: full tests, linting, security, build, and documentation checks"
safety = "safe"
enabled_tools = ["read_file", "bash"]

instructions = """
PRE-PUSH VALIDATION:

CONTEXT:
This agent runs automatically before `git push`. It performs comprehensive validations
on ALL code to ensure only high-quality, secure, and working code is pushed to the
remote repository. This is the final gatekeeper before CI/CD.

KEY PRINCIPLES:
- COMPREHENSIVE: Validates all aspects of code quality
- THOROUGH: Runs full test suite, not just affected packages
- STRICT: Blocks on any critical issues
- SLOW BUT ACCURATE: Can take up to 300 seconds (5 minutes)
- FINAL GATE: Last check before code leaves local machine

TRIGGER:
- Runs automatically before `git push` (via git hook)
- Can also be run manually: `vibe run shared/git-hooks/pre-push`

VALIDATION ORDER:
1. Code Formatting (fast, quick to fix)
2. Code Quality (linting, style)
3. Security (vulnerability scanning)
4. Build (compilation)
5. Tests (full test suite)
6. Documentation (optional, non-blocking)
7. Dependencies (vulnerability check)

STEPS:
1. Get list of changed files from git
2. Run all validation steps
3. Aggregate results
4. Block push if any blocking issues found
5. Report detailed results

DETAILED VALIDATION:

===== 1. CODE FORMATTING =====

✅ Go Formatting:
   Command: `gofmt -l .`
   - Check: All Go files are properly formatted
   - If files need formatting: BLOCKING
   - Suggestion: Run `gofmt -w .`
   - Alternative: `goimports -d .` for import formatting

✅ TypeScript Formatting:
   Command: `npx prettier --check .`
   - Check: All TypeScript/JS files are properly formatted
   - If files need formatting: BLOCKING
   - Suggestion: Run `npx prettier --write .`

✅ Formatting Summary:
   - Files checked: <count>
   - Files needing formatting: <count>
   - If > 0: BLOCK

===== 2. CODE QUALITY =====

✅ Go Linting:
   Command: `golangci-lint run -c .golangci.yml ./...`
   - Uses: Project's .golangci.yml configuration
   - Check: All lint errors are fixed
   - Errors: BLOCKING
   - Warnings: WARNING (non-blocking)
   - Report: Errors by linter type

✅ TypeScript Linting:
   Command: `npx eslint . --ext .ts,.tsx,.js,.jsx`
   - Check: All lint errors are fixed
   - Errors: BLOCKING
   - Warnings: WARNING (non-blocking)
   - Report: Errors by file

✅ Code Quality Summary:
   - Go Lint Errors: <count>
   - Go Lint Warnings: <count>
   - TypeScript Lint Errors: <count>
   - TypeScript Lint Warnings: <count>
   - If errors > 0: BLOCK

===== 3. SECURITY SCANNING =====

✅ Go Security:
   Command: `gosec -include G101,G104,G201,G202,G301,G302,G401,G402,G404 ./...`
   - Check: No CRITICAL or HIGH severity issues
   - CRITICAL/HIGH: BLOCKING
   - MEDIUM/LOW: WARNING (non-blocking)
   - Report: Issues by severity and type

✅ Go Dependency Vulnerabilities:
   Command: `govulncheck ./...`
   - Check: No known vulnerabilities in Go dependencies
   - CRITICAL/HIGH: BLOCKING
   - MEDIUM/LOW: WARNING (non-blocking)
   - Report: Vulnerabilities by severity

✅ Node.js Dependency Vulnerabilities:
   Command: `npm audit --audit-level=high`
   - Check: No HIGH or CRITICAL severity vulnerabilities
   - HIGH/CRITICAL: BLOCKING
   - MODERATE/LOW: WARNING (non-blocking)
   - Report: Vulnerabilities by severity

✅ Hardcoded Secrets:
   Command: `grep -r -i -E "(password|passwd|secret|token|key|auth)" --include="*.go" --include="*.ts" --include="*.tsx" --include="*.json" --include="*.yaml" --include=".env*" .`
   - Exclude: test files, example files, .git/ directory
   - Check: No hardcoded credentials or API keys
   - If found: BLOCKING
   - Report: File and line number for each finding

✅ Security Summary:
   - gosec Issues: <count> (CRITICAL: <c>, HIGH: <h>, MEDIUM: <m>, LOW: <l>)
   - Go Vulnerabilities: <count> (CRITICAL: <c>, HIGH: <h>)
   - Node.js Vulnerabilities: <count> (CRITICAL: <c>, HIGH: <h>)
   - Hardcoded Secrets: <count>
   - If CRITICAL/HIGH issues > 0 or secrets found: BLOCK

===== 4. BUILD VALIDATION =====

✅ Go Build:
   Command: `go build ./...`
   - Check: All Go packages build successfully
   - If build fails: BLOCKING
   - Report: Compilation errors

✅ TypeScript Compilation:
   Command: `npx tsc --noEmit`
   - Check: No TypeScript type errors
   - If errors: BLOCKING
   - Report: Type errors by file

✅ Frontend Build:
   Command: `npm run build` (in frontend directory)
   - Check: Frontend builds successfully
   - If build fails: BLOCKING
   - Report: Build errors

✅ Build Summary:
   - Go Build: <success/failure>
   - TypeScript: <success/failure>
   - Frontend Build: <success/failure>
   - If any build fails: BLOCK

===== 5. TEST VALIDATION =====

✅ Go Tests:
   Command: `go test ./... -race -cover -coverprofile=coverage.out`
   - Run: All Go tests with race detector
   - Check: All tests pass
   - Check: Coverage meets minimum (80% for backend)
   - If tests fail: BLOCKING
   - If coverage < 80%: WARNING (non-blocking)
   - Report: Passed/failed counts, coverage percentage

✅ TypeScript Tests:
   Command: `npm test -- --watchAll=false --coverage --coverageReporters=text`
   - Run: All frontend tests
   - Check: All tests pass
   - Check: Coverage meets minimum (70% for frontend)
   - If tests fail: BLOCKING
   - If coverage < 70%: WARNING (non-blocking)
   - Report: Passed/failed counts, coverage percentage

✅ Integration Tests:
   Command: Run end-to-end tests if configured
   - Check: Integration tests pass
   - If configured and fail: BLOCKING
   - Report: Passed/failed counts

✅ Test Summary:
   - Go Tests: <passed>/<total> (<coverage>%)
   - Frontend Tests: <passed>/<total> (<coverage>%)
   - Integration Tests: <passed>/<total>
   - If any tests fail: BLOCK

===== 6. DOCUMENTATION VALIDATION =====

✅ Documentation Completeness:
   Command: Run documentation agent in validate mode
   - Check: All new functions have doc comments
   - Check: All new types have doc comments
   - Check: README is up to date
   - Check: CHANGELOG is up to date (if applicable)
   - Errors: WARNING (non-blocking)
   - Report: Missing documentation

✅ Documentation Quality:
   - Check: Doc comments follow conventions
   - Check: Examples are provided
   - Check: Parameter descriptions are present
   - WARNING (non-blocking)

✅ Documentation Summary:
   - Documentation Coverage: <percentage>%
   - Missing: <count> items
   - If coverage < 80%: WARNING (non-blocking)

===== 7. DEPENDENCY VALIDATION =====

✅ Go Dependencies:
   Command: `go mod tidy` (dry run)
   - Check: go.mod and go.sum are in sync
   - If not: BLOCKING
   - Command: `go list -m all | grep -v '^github.com/SimonFremont-dev'`
   - Check: All dependencies are used
   - If unused: WARNING (non-blocking)

✅ Node.js Dependencies:
   Command: `npm ls --depth=0`
   - Check: All dependencies are installed correctly
   - If errors: BLOCKING
   - Check: No unused dependencies
   - If unused: WARNING (non-blocking)

✅ Dependency Summary:
   - Go Dependencies: <count>
   - Node.js Dependencies: <count>
   - Unused Dependencies: <count>
   - If sync issues: BLOCK

===== 8. GIT VALIDATION =====

✅ Commit Message Quality:
   - Check: Commit messages follow conventions
   - Convention: Conventional Commits (recommended)
     - feat: new feature
     - fix: bug fix
     - docs: documentation changes
     - style: formatting changes
     - refactor: code refactoring
     - test: test changes
     - chore: maintenance tasks
   - Check: Messages are descriptive
   - Check: Messages are not too long (> 72 chars for subject)
   - WARNING (non-blocking)

✅ Branch Validation:
   - Check: Branch name follows conventions
   - Convention: feature/<description>, fix/<description>, docs/<description>
   - Check: Branch is up to date with main/master
   - WARNING (non-blocking)

✅ Code Review:
   - Check: Code has been reviewed (if applicable)
   - Check: All review comments are addressed
   - If not: WARNING (non-blocking)

===== SPECIAL HANDLING =====

✅ Changed Files Detection:
   Command: `git diff --name-only origin/<branch>...HEAD`
   - Detect: All files changed since last push
   - Focus: Validation on changed files (but run full suite for safety)

✅ Partial Validation:
   - If only Go files changed: Skip frontend validations
   - If only TypeScript files changed: Skip Go validations
   - If only docs changed: Only run documentation validation
   - Smart: But still run full validation for safety

✅ Caching:
   - Cache: Results of slow validations (security scan, full test suite)
   - Invalidate: Cache when files change
   - Use: To speed up subsequent runs

REPORT FORMAT:
---
Pre-Push Validation: [PASS / FAIL]

Git Status:
  Branch: <branch>
  Remote: <remote>
  Changed Files: <count>
  Commit Messages: <count>

CODE FORMATTING:
✅ Go Formatting: [PASS/FAIL]
   Files Needing Formatting: <count>
   
✅ TypeScript Formatting: [PASS/FAIL]
   Files Needing Formatting: <count>

CODE QUALITY:
✅ Go Linting: [PASS/FAIL]
   Errors: <count>, Warnings: <count>
   
✅ TypeScript Linting: [PASS/FAIL]
   Errors: <count>, Warnings: <count>

SECURITY:
✅ gosec: [PASS/FAIL]
   CRITICAL: <count>, HIGH: <count>, MEDIUM: <count>, LOW: <count>
   
✅ Go Vulnerabilities: [PASS/FAIL]
   CRITICAL: <count>, HIGH: <count>
   
✅ Node.js Vulnerabilities: [PASS/FAIL]
   CRITICAL: <count>, HIGH: <count>
   
✅ Hardcoded Secrets: [PASS/FAIL]
   Found: <count>

BUILD:
✅ Go Build: [PASS/FAIL]
   Errors: <count>
   
✅ TypeScript Compilation: [PASS/FAIL]
   Errors: <count>
   
✅ Frontend Build: [PASS/FAIL]
   Errors: <count>

TESTS:
✅ Go Tests: [PASS/FAIL]
   Passed: <count>/<total> (<coverage>%)
   
✅ Frontend Tests: [PASS/FAIL]
   Passed: <count>/<total> (<coverage>%)
   
✅ Integration Tests: [PASS/FAIL]
   Passed: <count>/<total>

DOCUMENTATION:
✅ Documentation: [PASS/FAIL]
   Coverage: <percentage>%
   Missing: <count> items

DEPENDENCIES:
✅ Go Dependencies: [PASS/FAIL]
   Sync: <in sync/not in sync>
   
✅ Node.js Dependencies: [PASS/FAIL]
   Sync: <in sync/not in sync>

GIT:
✅ Commit Messages: [PASS/FAIL]
   Issues: <count>
   
✅ Branch Name: [PASS/FAIL]
   Valid: <yes/no>

SUMMARY:
Validation Time: <duration>
Total Checks: <count>
Passed: <count>
Failed: <count>
Warnings: <count>

VALIDATION: [PASSED / FAILED]

PUSH BLOCKED: [YES / NO]

If YES (BLOCKED):
  BLOCKERS:
    <list of blocking issues with remediation>
  
  To fix and retry:
    1. Fix all blocking issues
    2. Run: `vibe run shared/git-hooks/pre-push`
    3. Commit any changes: `git add . && git commit -m "Fix pre-push issues"`
    4. Push: `git push`

If NO (PASSED):
  All checks passed! Code is ready for push.
  
  WARNINGS:
    <list of warnings with suggestions>
  
  Consider addressing warnings before push or in a follow-up commit.
---

BLOCKING CONDITIONS:
- Code formatting issues
- Code lint errors
- CRITICAL or HIGH severity security issues
- Hardcoded secrets
- Build failures
- Test failures
- Dependency sync issues
- go.mod/go.sum out of sync

NON-BLOCKING (Warnings):
- Code lint warnings
- MEDIUM or LOW severity security issues
- Low test coverage (< 80% backend, < 70% frontend)
- Documentation gaps
- Commit message quality
- Branch name quality
- Unused dependencies

TIMEOUT: 300 seconds (5 minutes)
FALLBACK: If timeout, BLOCK push and report timeout

CACHE: Results are cached and invalidated on file changes
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "git diff",
  "git log",
  "git status",
  "git branch",
  "gofmt",
  "goimports",
  "golangci-lint",
  "gosec",
  "govulncheck",
  "go build",
  "go test",
  "go mod",
  "npx",
  "npm",
  "node",
  "eslint",
  "prettier",
  "tsc",
  "npm test",
  "npm run build",
  "grep",
  "awk",
  "wc",
  "find",
  "cat",
  "echo"
]
timeouts = { 
  default = 120, 
  go_test = 180, 
  npm_test = 180, 
  security_scan = 180, 
  overall = 300 
}
