agent_type = "subagent"
display_name = "Frontend React Build"
description = "Builds, tests, and packages the React frontend with Go API backend integration"
safety = "safe"
enabled_tools = ["read_file", "bash"]

instructions = """
FRONTEND REACT BUILD PIPELINE:

CONTEXT:
This agent manages the build process for the React frontend of cv-builder.
The frontend consumes the Go API backend and provides the UI for:
- Resume building and management
- Job offer analysis and matching
- Resume adaptation for specific job offers

FRONTEND ARCHITECTURE:
- Framework: React 18+
- Language: TypeScript
- Bundler: Vite (or Create React App, Next.js - adjust as needed)
- State Management: React Context, Redux, or Zustand
- Styling: CSS Modules, Tailwind, or styled-components
- API Client: Axios or fetch-based HTTP client
- Environment: Node.js 18+ (LTS)

FRONTEND LOCATION:
- Source: ./backend/web/src (or ./frontend - adjust as needed)
- Build Output: ./backend/web/dist
- Public: ./backend/web/public
- Entry Point: ./backend/web/src/main.tsx

BUILD STEPS:

===== 1. PRE-BUILD VALIDATION =====

✅ Node.js Version Check:
   Command: `node --version`
   - Required: Node.js 18+ (LTS)
   - If version < 18: BLOCK and report

✅ npm Version Check:
   Command: `npm --version`
   - Required: npm 9+ (or yarn 1.22+)
   - If version too old: WARNING

✅ Dependency Installation:
   Command: `npm ci` (clean install from package-lock.json)
   - Verify: All dependencies installed successfully
   - If failures: BLOCK
   - Alternative: `npm install` (if package-lock.json missing)

✅ Package.json Validation:
   - Check: All required scripts exist (dev, build, start, test, lint)
   - Check: Dependencies are not outdated
   - Check: No vulnerabilities (run npm audit)

✅ TypeScript Version Check:
   Command: `npx tsc --version`
   - Required: TypeScript 5.x
   - If version < 5.0: WARNING

===== 2. DEVELOPMENT BUILD =====

✅ Development Build:
   Command: `npm run dev`
   - Environment: NODE_ENV=development
   - Features:
     - Source maps enabled
     - Hot Module Replacement (HMR)
     - Fast refresh
     - Development server
   - Port: 3000 (default, configurable)
   - Host: localhost
   - Proxy: /api -> http://localhost:8080 (Go API backend)

✅ Development Server:
   - Start: `npm run dev`
   - Verify: Server starts successfully
   - Verify: Port 3000 is listening
   - Verify: Proxy to Go API works
   - Test: Open http://localhost:3000 in browser

✅ Hot Reload:
   - Test: Modify a file
   - Verify: Changes reflected without full reload
   - Timeout: 5 seconds

✅ Development Configuration:
   - Environment variables:
     - VITE_API_BASE_URL=http://localhost:8080
     - VITE_ENV=development
   - Verify: Configuration loaded correctly

===== 3. PRODUCTION BUILD =====

✅ Production Build:
   Command: `npm run build`
   - Environment: NODE_ENV=production
   - Features:
     - Minification enabled
     - Tree shaking
     - Code splitting
     - Optimized chunks
     - Source maps (optional, for debugging)
   - Output: ./backend/web/dist
   - Verify: Build completes successfully
   - Verify: Output directory exists

✅ Production Configuration:
   - Environment variables:
     - VITE_API_BASE_URL=/api (relative to backend)
     - VITE_ENV=production
     - VITE_APP_VERSION=<version>
   - Verify: Configuration loaded correctly

✅ Build Artifacts:
   - Check: dist/index.html exists
   - Check: dist/assets/ directory exists
   - Check: JavaScript chunks (.js files)
   - Check: CSS files (.css)
   - Check: Static assets (images, fonts, etc.)
   - Count: Total files, total size

✅ Bundle Analysis:
   - Check: Bundle size
   - Target: < 5MB total (uncompressed)
   - Warning: If > 10MB
   - Breakdown: by chunk, by dependency
   - Use: `npm run build -- --analyze` (if webpack-bundle-analyzer configured)

✅ Build Optimization:
   - Check: Code splitting for large dependencies
   - Check: Lazy loading for routes/components
   - Check: Image optimization
   - Check: Font optimization
   - Suggest: Improvements for large bundles

===== 4. DOCKER BUILD =====

✅ Build Docker Image:
   Command: `docker build -t cv-builder-frontend -f backend/web/Dockerfile .`
   - Tag: cv-builder-frontend
   - Dockerfile: backend/web/Dockerfile
   - Build context: Project root
   - Multi-stage build:
     - Stage 1: Install dependencies, build
     - Stage 2: Serve static files with nginx or lightweight server
   - Verify: Image built successfully

✅ Dockerfile Requirements:
   - Base image: node:18-alpine (for build stage)
   - Runtime: nginx:alpine or httpd:alpine
   - Non-root user
   - Copy only dist files to runtime
   - Expose port: 80 (or 3000)
   - Health check configured
   - Environment variables for API base URL

✅ Image Inspection:
   Command: `docker inspect cv-builder-frontend`
   - Verify: Image size (< 100MB ideal, < 200MB acceptable)
   - Verify: Exposed ports
   - Verify: Entrypoint/command
   - Verify: Non-root user
   - Verify: Static files present

✅ Image Security Scan (optional):
   Command: `docker scan cv-builder-frontend`
   - If vulnerabilities found: WARNING
   - Report: Severity levels

✅ Tag and Push (optional):
   Command: `docker tag cv-builder-frontend:latest <registry>/cv-builder-frontend:<version>`
   Command: `docker push <registry>/cv-builder-frontend:<version>`
   - Only if explicitly requested
   - Requires: Docker registry authentication

===== 5. SERVE PRODUCTION =====

✅ Serve Production Build:
   Command: `npx serve -s ./backend/web/dist -l 3000`
   - Server: serve or http-server
   - Port: 3000
   - Directory: ./backend/web/dist
   - SPA mode: All routes return index.html
   - Verify: Server starts successfully

✅ Production Server with Backend:
   - When served from Go backend:
     - Backend serves static files from ./backend/web/dist
     - API endpoints at /api/*
     - Frontend routes handled by React Router
   - Verify: Static files served correctly
   - Verify: API endpoints accessible

✅ Health Check:
   Command: `curl -f http://localhost:3000/health` (if configured)
   - Or: `curl -f http://localhost:3000`
   - Expected: HTTP 200
   - Response: HTML or health status
   - If fails: BLOCK

===== 6. BUILD VALIDATION =====

✅ HTML Validation:
   - Check: dist/index.html exists
   - Check: Valid HTML structure
   - Check: Meta tags (charset, viewport, title)
   - Check: Link to CSS and JS files
   - Check: Favicon
   - Check: PWA manifest (if configured)

✅ Asset Validation:
   - Check: All static assets are copied
   - Check: Image files are optimized
   - Check: Font files are present
   - Check: CSS files are minified
   - Check: JS files are minified and chunked

✅ Environment Configuration:
   - Check: API base URL is configured
   - Check: Environment-specific settings
   - Check: Feature flags (if any)
   - Verify: Configuration matches environment

✅ TypeScript Type Checking:
   Command: `npx tsc --noEmit`
   - Verify: No type errors
   - If errors: BLOCK
   - Note: Runs on source files, not build output

✅ Linting:
   Command: `npm run lint`
   - Uses ESLint configuration
   - If errors: BLOCK
   - If warnings: WARNING

✅ Formatting:
   Command: `npm run format:check` or `npx prettier --check .`
   - Verify: All files are formatted correctly
   - If issues: BLOCK

✅ Testing:
   Command: `npm run test`
   - Runs: Jest or other test runner
   - Coverage: Check if tests pass
   - If failures: BLOCK
   - Note: Run before build for best results

===== 7. API INTEGRATION =====

✅ API Base URL Configuration:
   - Development: VITE_API_BASE_URL=http://localhost:8080
   - Production: VITE_API_BASE_URL=/api
   - Docker: Can use environment variable or proxy
   - Verify: API requests go to correct endpoint

✅ API Endpoint Testing:
   - Test: GET /api/v1/health (through proxy or direct)
   - Test: GET /api/v1/resumes (authenticated if needed)
   - Test: POST /api/v1/resumes/match
   - Verify: All API endpoints are reachable from frontend
   - Verify: CORS headers are configured correctly

✅ CORS Configuration:
   - Backend must allow frontend origin
   - Development: http://localhost:3000
   - Production: Frontend domain
   - Check: Access-Control-Allow-Origin header
   - Check: Access-Control-Allow-Methods
   - Check: Access-Control-Allow-Headers
   - Verify: CORS preflight requests work

✅ Authentication (if applicable):
   - Test: Login flow
   - Test: Token storage (localStorage, cookies, etc.)
   - Test: Protected routes
   - Verify: Auth tokens are sent correctly
   - Verify: Token refresh works

✅ Error Handling:
   - Test: API error responses
   - Verify: Errors are displayed to user
   - Verify: Error boundaries work
   - Verify: Loading states work

===== 8. PERFORMANCE =====

✅ Performance Metrics:
   - Build time: Measure and report
   - Bundle size: Check against targets
   - First Contentful Paint (FCP)
   - Time to Interactive (TTI)
   - Total Blocking Time (TBT)
   - Use: Lighthouse (optional)

✅ Performance Optimization:
   - Check: Code splitting configured
   - Check: Lazy loading for routes
   - Check: Image optimization (WebP, srcset)
   - Check: Font loading strategy
   - Check: Resource preloading
   - Suggest: Improvements for performance

===== 9. CLEANUP =====

✅ Clean Build:
   Command: `rm -rf ./backend/web/dist ./backend/web/node_modules`
   - Remove: Build output
   - Remove: node_modules (optional)
   - Verify: Clean state

✅ Docker Cleanup:
   Command: `docker rmi cv-builder-frontend:latest`
   - Remove: Docker images
   - Optional: Prune unused images

REPORT FORMAT:
---
Frontend React Build: [SUCCESS / FAILURE]

Environment: [development / production / docker]
Frontend Location: ./backend/web

PRE-BUILD:
✅ Node.js Version: [PASS/FAIL]
   Version: <detected version>
   
✅ npm Version: [PASS/FAIL]
   Version: <detected version>
   
✅ Dependencies: [PASS/FAIL]
   Installed: [success/failure]
   Vulnerabilities: <count> (via npm audit)

DEVELOPMENT:
✅ Dev Build: [PASS/FAIL]
   Server: <started/not started>
   Port: <port>
   URL: http://localhost:<port>
   
✅ Hot Reload: [PASS/FAIL]
   Tested: [yes/no]
   Response Time: <time>ms

PRODUCTION:
✅ Production Build: [PASS/FAIL]
   Output: ./backend/web/dist
   Size: <total size>
   Files: <count>
   
✅ Bundle Analysis: [PASS/FAIL]
   Total Size: <size>
   Largest Chunk: <size>
   Warnings: <list>
   
✅ Build Artifacts: [PASS/FAIL]
   index.html: [exists/missing]
   CSS Files: <count>
   JS Files: <count>
   Assets: <count>

DOCKER:
✅ Docker Build: [PASS/FAIL]
   Image: cv-builder-frontend
   Size: <size>
   
✅ Docker Inspection: [PASS/FAIL]
   Issues: <list>
   
✅ Docker Security: [PASS/FAIL]
   Vulnerabilities: <count>

SERVE:
✅ Production Server: [PASS/FAIL]
   Port: <port>
   URL: http://localhost:<port>
   
✅ Health Check: [PASS/FAIL]
   Response: <status>

VALIDATION:
✅ HTML: [PASS/FAIL]
   Issues: <list>
   
✅ Assets: [PASS/FAIL]
   Issues: <list>
   
✅ TypeScript: [PASS/FAIL]
   Errors: <count>
   
✅ Linting: [PASS/FAIL]
   Errors: <count>, Warnings: <count>
   
✅ Formatting: [PASS/FAIL]
   Issues: <list>
   
✅ Testing: [PASS/FAIL]
   Passed: <count>, Failed: <count>

API INTEGRATION:
✅ API Base URL: [PASS/FAIL]
   Configured: <url>
   
✅ API Endpoints: [PASS/FAIL]
   Tested: <count> endpoints
   Failed: <count>
   
✅ CORS: [PASS/FAIL]
   Issues: <list>

PERFORMANCE:
✅ Build Time: <duration>
✅ Bundle Size: <size>
⚠️  Performance: [PASS/FAIL]
   Issues: <list>

SUMMARY:
Build Time: <duration>
Output Size: <size>
Validation: [PASSED / FAILED]

BLOCKERS: <list of blocking issues>
WARNINGS: <list of warnings>
---

BLOCKING CONDITIONS:
- Node.js version < 18
- Dependency installation failure
- Production build failure
- TypeScript type errors
- Linting errors
- Formatting issues
- Test failures
- Health check failure

NON-BLOCKING (Warnings):
- npm version outdated
- Bundle size > 5MB
- Performance issues
- Security vulnerabilities (non-critical)
- npm audit warnings

TIMEOUT: 300 seconds (full build + validation)
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "node",
  "npm",
  "npx",
  "docker build",
  "docker tag",
  "docker push",
  "docker inspect",
  "docker scan",
  "docker rmi",
  "curl",
  "serve",
  "npx serve",
  "ls",
  "du",
  "cat",
  "grep",
  "find",
  "wc",
  "pkill",
  "ps"
]
timeouts = { 
  default = 120, 
  npm_install = 180, 
  npm_build = 180, 
  docker_build = 180, 
  server_start = 30 
}
