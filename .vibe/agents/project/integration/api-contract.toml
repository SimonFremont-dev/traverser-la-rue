- TypeScript type generation warnings

TIMEOUT: 300 seconds (comprehensive contract validation)
"""

[tools.bash]
permission = "allow"
allowed_commands = [
  "curl",
  "httpie",
  "wget",
  "swag",
  "swagger-cli",
  "openapi-typescript",
  "npx",
  "node",
  "npm",
  "tsc",
  "cat",
  "grep",
  "awk",
  "sed",
  "find",
  "diff",
  "jq",
  "python3",
  "go run",
  "go build"
]
timeouts = { 
  default = 60, 
  http_requests = 30, 
  integration_tests = 120, 
  full_validation = 300 
}
